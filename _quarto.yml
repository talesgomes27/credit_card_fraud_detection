format:
  html:
    theme: cosmo
    lang: pt-BR
    toc: true
    toc-depth: 3
    toc-title: "Neste Relatório"
    smooth-scroll: true
    code-fold: true
    code-tools: false
    code-copy: true
    number-sections: true
    title-block-banner: true
    fig-align: center
    fig-dpi: 300
    df-print: kable

execute:
  freeze: auto
  warning: false
  message: false
